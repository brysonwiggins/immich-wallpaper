name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # only used to commit recorded screenshots back to the branch
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Check (lint + all JVM/unit tests) and build the APKs
        run: ./gradlew check :app:assembleFossDebug :app:assemblePlayDebug :app:assembleFossRelease --stacktrace

      # Screenshot goldens (app/src/test/screenshots) are verified on every push. A commit message
      # containing "[record screenshots]" re-records them instead and commits them back.
      - name: Record screenshots
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[record screenshots]')
        run: |
          ./gradlew :app:recordRoborazziFossDebug --stacktrace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/screenshots
          git diff --cached --quiet || git commit -m "Record screenshot goldens for ${GITHUB_SHA::7}"
          git push origin HEAD:${{ github.ref_name }}

      - name: Verify screenshots
        if: "!(github.event_name == 'push' && contains(github.event.head_commit.message, '[record screenshots]')) && hashFiles('app/src/test/screenshots/**') != ''"
        run: ./gradlew :app:verifyRoborazziFossDebug --stacktrace

      - name: Upload app APKs
        uses: actions/upload-artifact@v4
        with:
          name: wallpapers-with-immich-apks
          path: |
            app/build/outputs/apk/foss/debug/*.apk
            app/build/outputs/apk/play/debug/*.apk
            app/build/outputs/apk/foss/release/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            app/src/test/screenshots/**/*_compare.png
            app/src/test/screenshots/**/*_actual.png
